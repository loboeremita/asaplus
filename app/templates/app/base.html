<!DOCTYPE html>
{% load static %}
{% load django_htmx %}
{% load tailwind_cli %}
<html lang="pt_BR">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="Descrição do site">
        <meta name="keywords" content="modelo">
        <title>
            {% block titulo %}
                Modelo
            {% endblock titulo %}
        </title>
        <script src="{% static "js/alpine.js" %}"></script>
        <script src="{% static 'fontawesomefree/js/all.min.js' %}"></script>
        {% htmx_script %}
        {% tailwind_css "app" %}
    </head>
    <body hx-headers='{"x-csrftoken": "{{ csrf_token }}"}' class="bg-gray-100 min-h-screen flex flex-col">
        <header>
            <div class="flex items-start justify-between p-4 bg-gray-500 text-white mb-4">
                <span class="text-blue-100 font-bold text-2xl">ASA+</span>
            {% lorem 7 w random %}
            <span>Entrar</span>
            </div>
        </header>
        <main class="grow">
            <div class="flex items-center justify-center">
                {% block main %}
                {% lorem 3 p %}
                {% endblock main %}
            </div>
        </main>
        <footer class="mt-auto">
            <div class="text-center text-gray-600 bg-gray-300 mt-4 p-4 flex justify-evenly items-center">
                <span>ASA+©</span><span>Todos os direitos reservados.</span><span>2026</span>
            </div>
        </footer>
    </body>
</html>
